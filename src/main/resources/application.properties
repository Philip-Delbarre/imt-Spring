# =====================================================================
#  CONFIGURATION DE LA BASE DE DONNÉES
#  C'est ICI (et dans les classes @Entity) que la base est configurée.
#  JerseyConfig, lui, ne configure QUE l'API REST (chemin /api, classes exposées).
# =====================================================================
spring.application.name=client-panier
server.port=8080

# --- Connexion : une seule base H2 (un fichier), qui contient les 2 tables ---
#   - produits : créée à partir de l'entité  com.merchant.entity.Produit            (MVC)
#   - clients  : créée à partir de l'entité  ...adapter.out.persistence.ClientJpaEntity (hexagonal)
# Aucune clé étrangère ni table de liaison entre les deux : le client stocke
# simplement les ids de ses produits dans sa colonne produit_ids (ex : "1,4,7").
spring.datasource.url=jdbc:h2:file:./data/panier
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Hibernate (JPA) ---
# update : crée les tables qui n'existent pas et ajoute les colonnes manquantes,
#          sans vider la base à chaque lancement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# passer à true pour voir les requêtes SQL dans la console
spring.jpa.show-sql=false

# --- Console H2 : http://localhost:8080/h2 (JDBC URL : jdbc:h2:file:./data/panier, user sa) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2
