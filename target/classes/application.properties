spring.application.name=merchant

# Ne recrée pas toute la base à chaque démarrage
spring.jpa.hibernate.ddl-auto=update

# Base H2 stockée dans un fichier local
spring.datasource.url=jdbc:h2:file:./data/clients;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver

# Identifiants H2
spring.datasource.username=sa
spring.datasource.password=

# Dialecte H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2 : http://localhost:8080/h2
spring.h2.console.enabled=true
spring.h2.console.path=/h2